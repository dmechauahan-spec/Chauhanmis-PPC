<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chauhanmis PPC</title>
    <script>
      // Applied before React mounts (and before first paint) so there's no
      // flash of the wrong theme. Keep the storage key and fallback logic
      // here in sync with src/lib/theme-context.tsx — this script can't
      // import from src since it has to run before the bundle loads.
      //
      // Three stored states are possible now: 'light', 'dark', or 'system'
      // (which resolves via the OS media query, same as theme-context.tsx
      // does at runtime). A first-time visitor — nothing in storage at all
      // — gets 'light' directly, with NO OS query in that case; only an
      // explicit 'system' choice ever consults prefers-color-scheme here.
      (function () {
        var STORAGE_KEY = "ppc-theme";
        var stored = localStorage.getItem(STORAGE_KEY);
        var theme;
        if (stored === "light" || stored === "dark") {
          theme = stored;
        } else if (stored === "system") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } else {
          theme = "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
