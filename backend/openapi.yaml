        '200': { description: Paginated list of RM inventory }
    post:
      tags: [RM Inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RmInventory' }
      responses:
        '201': { description: Created }
        '400': { description: Validation error }

  /rm-inventory/{partId}:
    parameters:
      - name: partId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [RM Inventory]
      responses:
        '200': { description: RM inventory row }
        '404': { description: Not found }
    patch:
      tags: [RM Inventory]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RmInventory' }
      responses:
        '200': { description: 'Updated (direct overwrite, no ledger entry)' }
        '404': { description: Not found }
    delete:
      tags: [RM Inventory]
      responses:
        '200': { description: Deleted }
        '400': { description: Blocked by BOM references }
        '404': { description: Not found }

  /rm-inventory/{partId}/adjust-stock:
    parameters:
      - name: partId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [RM Inventory]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delta: { type: number, description: 'Signed delta, e.g. -5 or +20' }
                reason: { type: string }
              required: [delta, reason]
      responses:
        '200': { description: Updated inventory + created rm_transactions row }
        '400': { description: Adjustment would result in negative stock }
        '404': { description: Not found }

  /rm-inventory/{partId}/transactions:
    parameters:
      - name: partId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [RM Inventory]
      responses:
        '200': { description: Stock adjustment ledger for this part }
        '404': { description: Not found }

  /orders:
    get:
      tags: [Orders]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: status
          in: query
          schema: { type: string }
        - name: priority
          in: query
          schema: { type: string }
        - name: client
          in: query
          schema: { type: string }
        - name: sku
          in: query
          schema: { type: string }
        - name: sortBy
          in: query
          schema: { type: string, enum: [dueDate, createdAt], default: createdAt }
        - name: sortDir
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        '200': { description: Paginated list of orders }
    post:
      tags: [Orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderId: { type: string }
                client: { type: string }
                sku: { type: string }
                qty: { type: integer }
                dueDate: { type: string, format: date }
                priority: { type: string, enum: [Low, Medium, High] }
                specialRequirements:
                  type: string
                  description: Client Flow Part 1. Optional free-text — see README "Client Flow Part 1".
              required: [orderId, client, sku, qty]
      responses:
        '201': { description: 'Created (status always starts at Open; product is snapshotted from the SKU''s productType)' }
        '400': { description: Unknown sku, qty <= 0, or dueDate in the past }

  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Orders]
      responses:
        '200': { description: Order }
        '404': { description: Not found }
    patch:
      tags: [Orders]
      summary: >
        Client Flow Part 1. General field update, separate from the dedicated status-transition
        endpoint below — currently covers specialRequirements only, and never touches status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                specialRequirements: { type: string, nullable: true }
      responses:
        '200': { description: Updated }
        '400': { description: Validation error }
        '404': { description: Not found }
    delete:
      tags: [Orders]
      responses:
        '200': { description: Deleted }
        '400': { description: Status is not Open }
        '404': { description: Not found }

  /orders/{orderId}/status:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Orders]
      description: >
        Client Flow Part 4B. delayReason/finalRemarks are accepted on every transition (simplest
        schema shape) but only ever read/persisted — into order_closure_summaries — when newStatus
        is Closed; sent alongside any other transition they're accepted but have no effect
        anywhere. See README "Client Flow Part 4". When newStatus is Closed, a closure summary is
        captured automatically in the same transaction as the status write — see
        OrderClosureSummary and GET /orders/{orderId}/closure-summary below.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                newStatus:
                  type: string
                  enum: [Open, PendingRM, Scheduled, Running, QC, DispatchReady, Closed]
                changedBy: { type: string }
                delayReason: { type: string, description: Only persisted when newStatus is Closed. }
                finalRemarks: { type: string, description: Only persisted when newStatus is Closed. }
              required: [newStatus]
      responses:
        '200': { description: Order moved to newStatus; order_status_history row written }
        '400': { description: Invalid transition (must follow the sequential flow) }
        '404': { description: Not found }

  /orders/{orderId}/closure-summary:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Orders]
      summary: The automatically-captured closure summary for a Closed order
      description: Client Flow Part 4B. System-written only — see README "Client Flow Part 4".
      responses:
        '200':
          description: OrderClosureSummary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderClosureSummary' }
        '404': { description: "Unknown orderId ('not found'), or the order exists but hasn't reached Closed yet ('not been closed yet') — distinguishable messages, see README." }

  /orders/{orderId}/history:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Orders]
      responses:
        '200':
          description: Full status history for the order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OrderStatusHistory' }
        '404': { description: Not found }

  /daily-logs:
    get:
      tags: [Daily Logs]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
        - name: lineId
          in: query
          schema: { type: string }
        - name: modelId
          in: query
          schema: { type: string }
        - name: shift
          in: query
          schema: { type: string }
      responses:
        '200': { description: 'Paginated list of daily logs, sorted by logDate desc, savedAt desc' }
    post:
      tags: [Daily Logs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DailyProductionLog'
                - type: object
                  properties:
                    downtimeEntries:
                      type: array
                      items: { $ref: '#/components/schemas/DowntimeEntry' }
              required: [logDate, savedBy]
      responses:
        '201':
          description: >
            Created. logId is always server-generated (DL-YYYYMMDD-NN); absentEmployees and
            attendancePct are always server-computed and ignore any client-sent value.
        '400': { description: Validation error (unknown lineId/modelId/orderId, presentEmployees > totalEmployees, missing notes on reason=Other, ...) }

  /daily-logs/{logId}:
    parameters:
      - name: logId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Daily Logs]
      responses:
        '200': { description: Daily log with downtimeEntries and stationAssignments }
        '404': { description: Not found }
    patch:
      tags: [Daily Logs]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DailyProductionLog' }
      responses:
        '200': { description: Updated (absentEmployees/attendancePct recomputed if totals changed) }
        '404': { description: Not found }
        '409': { description: logDate is more than the edit-window (1 day) in the past }

  /daily-logs/{logId}/downtime:
    parameters:
      - name: logId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Daily Logs]
      responses:
        '200':
          description: Downtime entries for this log
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DowntimeEntry' }
        '404': { description: Not found }
    post:
      tags: [Daily Logs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DowntimeEntry' }
      responses:
        '201': { description: Downtime entry added }
        '400': { description: 'Invalid reason, minutes <= 0, or missing notes for reason=Other' }
        '404': { description: Log not found }

