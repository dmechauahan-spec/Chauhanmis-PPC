openapi: 3.0.3
info:
  title: PPC Enterprise Backend API
  version: 0.1.0
  description: >
    Module 1 (Master Data), Module 2 (Orders), Module 3 (Daily Production
    Input), Module 4 (OEE Monitoring), Module 5 (BOM Explosion Engine),
    Module 6 (CTB — Clear To Build Engine), Module 7 (Material Dashboard),
    Module 8 (Order-Wise Shortage Analysis), Module 9 (Purchase
    Requisition Automation), Module 10 (Smart Scheduling Engine),
    Module 11 (Risk Prediction Engine), Module 12 (PPC Spotlight
    Search), Module 13 (QC Planning Integration), and Module 14
    (Dashboard & Analytics) of the PPC Enterprise system for Chauhan
    MIS Automation Solutions — all 14 modules of the original spec.
    All responses use the standard envelope `{ success, data }` or
    `{ success, error }`.


    **Authentication.** Every route below except `POST /auth/login`
    requires a `Bearer <token>` obtained from `POST /auth/login` (8-hour
    expiry, no refresh token). Every route additionally requires one of
    `Admin` / `StoreManager` / `ProductionManager` — `Admin` always
    passes; the per-module read/write role requirement is documented in
    README.md's "Authentication & Authorization" permission matrix,
    since arbitrary custom role names aren't natively expressible as
    OpenAPI security scopes. A missing/invalid token returns `401`; a
    valid token for the wrong role returns `403`.
servers:
  - url: http://localhost:3000/api
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: Auth
  - name: Products
  - name: Lines
  - name: Machines
  - name: HR Teams
  - name: BOM
  - name: RM Inventory
  - name: Orders
  - name: Daily Logs
  - name: OEE
  - name: BOM Explosion
  - name: CTB
  - name: Materials
  - name: Shortage Report
  - name: Purchase Requisitions
  - name: Scheduling
  - name: Production Plan
  - name: Risk
  - name: Search
  - name: QC
  - name: Testing Plans
  - name: QC Inspections
  - name: Dashboard
  - name: Order Status Dashboard
  - name: Warehouses
  - name: FG Batches
  - name: Sales Orders
  - name: FG Dispatches

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    pageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  schemas:
    ApiError:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            message: { type: string }
            details: {}

    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [Admin, StoreManager, ProductionManager] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Product:
      type: object
      properties:
        modelId: { type: string, example: MDL-8001 }
        modelName: { type: string, example: SP10B2 }
        productType: { type: string, example: OTG }
        sku: { type: string, example: SP10B2 }
        taktTimeSec: { type: number }
        manpowerRequired: { type: integer }
        noOfStations: { type: integer }
        changeoverTimeMin: { type: number, nullable: true }
        notes: { type: string, nullable: true }
        plywoodGrade:
          type: string
          nullable: true
          enum: [MR, BWR, BWP, Other]
          description: FG Module Part 1. Null for non-plywood products — see README "FG Module Part 1".
        thickness: { type: number, nullable: true, description: 'FG Module Part 1. mm.' }
        sheetLength: { type: number, nullable: true, description: 'FG Module Part 1. mm.' }
        sheetWidth: { type: number, nullable: true, description: 'FG Module Part 1. mm.' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProductionLine:
      type: object
      properties:
        lineId: { type: string, example: L1 }
        lineName: { type: string }
        maxWorkers: { type: integer }
        efficiencyPct: { type: number }
        status: { type: string, enum: [Active, Offline] }
        notes: { type: string, nullable: true }
        capPerDay: { type: number, nullable: true }
        productTypes:
          type: array
          items: { type: string }

    Machine:
      type: object
      description: >
        Client Flow Part 1. Per-Machine tracking within a Line (a Line can have several) — see
        README "Client Flow Part 1". At least one of capacityPerHour/capacityPerShift/capacityPerDay
        must be provided (Zod-layer validation, not a DB constraint).
      properties:
        machineId: { type: string, example: M-01 }
        machineName: { type: string }
        lineId: { type: string }
        capacityPerHour: { type: number, nullable: true }
        capacityPerShift: { type: number, nullable: true }
        capacityPerDay: { type: number, nullable: true }
        status: { type: string, enum: [Active, Offline, Maintenance] }
        notes: { type: string, nullable: true }
        line:
          type: object
          readOnly: true
          description: Parent line's basic info, included so the UI doesn't need a second lookup.
          properties:
            lineId: { type: string }
            lineName: { type: string }

    HrTeam:
      type: object
      properties:
        teamId: { type: string, example: HR1 }
        teamName: { type: string }
        lineId: { type: string, nullable: true }
        workers: { type: integer }
        skill: { type: string, nullable: true }
        attendancePct: { type: number, nullable: true }
        shift: { type: string, nullable: true }
        notes: { type: string, nullable: true }

    BomComponent:
      type: object
      properties:
        id: { type: integer }
        modelRef: { type: string, example: SP10B2 }
        uom: { type: string, enum: [Pcs, Set, Kg, Ltr, Mtr] }
        partName: { type: string }
        qtyPerUnit: { type: number }
        partId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    RmInventory:
      type: object
      properties:
        partId: { type: string }
        stock: { type: number }
        updatedAt: { type: string, format: date-time }

    RmTransaction:
      type: object
      properties:
        id: { type: integer }
        partId: { type: string }
        delta: { type: number }
        reason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    Order:
      type: object
      properties:
        orderId: { type: string, example: SO-1014 }
        client: { type: string }
        sku: { type: string }
        product: { type: string }
        qty: { type: integer }
        dueDate: { type: string, format: date, nullable: true }
        priority: { type: string, enum: [Low, Medium, High] }
        status:
          type: string
          enum: [Open, PendingRM, Scheduled, Running, QC, DispatchReady, Closed]
        createdAt: { type: string, format: date-time }
        specialRequirements:
          type: string
          nullable: true
          description: >
            Client Flow Part 1. Free-text, no other logic attached — see README "Client Flow Part 1".

    OrderStatusHistory:
      type: object
      properties:
        id: { type: integer }
        orderId: { type: string }
        oldStatus: { type: string, nullable: true }
        newStatus: { type: string }
        changedBy: { type: string, nullable: true }
        changedAt: { type: string, format: date-time }

    OrderClosureSummary:
      type: object
      description: >
        Client Flow Part 4B. Written exactly once, automatically, when an order's status
        transitions to Closed — never created or edited directly by a user. See README "Client
        Flow Part 4".
      properties:
        id: { type: integer }
        orderId: { type: string }
        totalOrderedQty: { type: number }
        totalProducedQty: { type: number, description: 'Sum of daily_production_log.totalOutputQty for this order (Part 1''s orderId linkage).' }
        totalQcPassedQty: { type: number }
        totalRejectedQty: { type: number }
        totalReworkQty: { type: number }
        plannedCompletionDate:
          type: string
          format: date
          nullable: true
          description: production_schedule.estEndDate if a schedule ever existed for this order, else null.
        actualCompletionDate: { type: string, format: date, description: Stamped at the moment the Closed transition is processed. }
        delayDays:
          type: integer
          nullable: true
          description: 'Signed: positive = closed late, negative = closed early. Null only when there was no schedule to compare against.'
        delayReason: { type: string, nullable: true }
        finalRemarks: { type: string, nullable: true }

    DowntimeEntry:
      type: object
      properties:
        id: { type: integer }
        logId: { type: string }
        reason:
          type: string
          enum:
            [
              Material Not Available,
              Machine Breakdown,
              Changeover Activity,
              Operator Unavailable,
              Power Failure,
              Other,
            ]
        minutes: { type: number }
        notes: { type: string, nullable: true }
      required: [reason, minutes]

    DailyProductionLog:
      type: object
      properties:
        logId: { type: string, example: DL-20260718-01, readOnly: true }
        logDate: { type: string, format: date }
        shift: { type: string, nullable: true }
        lineId: { type: string, nullable: true }
        lineName: { type: string, nullable: true }
        activeLinesCount: { type: integer, nullable: true }
        modelId: { type: string, nullable: true }
        modelName: { type: string, nullable: true }
        totalEmployees: { type: integer, nullable: true }
        presentEmployees: { type: integer, nullable: true }
        absentEmployees: { type: integer, nullable: true, readOnly: true }
        attendancePct: { type: number, nullable: true, readOnly: true }
        taktTimeOverride: { type: number, nullable: true }
        manpowerOverride: { type: integer, nullable: true }
        notes: { type: string, nullable: true }
        stationAssignments:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items: { type: string }
          example: { Element: [ajit, suresh], Pully: [karan, arjun] }
        savedBy: { type: string }
        savedAt: { type: string, format: date-time }
        plannedMinutes:
          type: number
          nullable: true
          description: >
            Shift's planned production minutes. Defaults from the shift lookup (see README) when
            omitted and not already set.
        totalOutputQty: { type: number, nullable: true, description: Total units produced during the shift. }
        goodQty:
          type: number
          nullable: true
          description: Units that passed quality. Must be <= totalOutputQty.
        orderId:
          type: string
          nullable: true
          description: >
            Client Flow Part 1. Links this log to a specific order — closes the gap Module 12
            documented (search's pendingQty was always null). Validated against orders if
            provided; does not itself change GET /search's pendingQty behavior. See README
            "Client Flow Part 1".
        rejectedQty:
          type: number
          nullable: true
          description: >
            Client Flow Part 1. Production team's own self-reported reject count — distinct from
            QC's authoritative numbers (Part 3, not yet built). See README "Client Flow Part 1".
        reworkQty:
          type: number
          nullable: true
          description: Client Flow Part 1. Production team's own self-reported rework count — see rejectedQty.
        downtimeEntries:
          type: array
          items: { $ref: '#/components/schemas/DowntimeEntry' }

    OeeResult:
      type: object
      description: OEE breakdown for a single daily_production_log row.
      properties:
        logId: { type: string }
        logDate: { type: string, format: date }
        shift: { type: string, nullable: true }
        lineId: { type: string, nullable: true }
        lineName: { type: string, nullable: true }
        modelId: { type: string, nullable: true }
        modelName: { type: string, nullable: true }
        plannedMinutes: { type: number, nullable: true }
        totalOutputQty: { type: number, nullable: true }
        goodQty: { type: number, nullable: true }
        downtimeMinutes: { type: number }
        runTimeMinutes: { type: number, nullable: true }
        availabilityPct: { type: number, nullable: true }
        standardOutput: { type: number, nullable: true }
        performancePct: { type: number, nullable: true }
        qualityPct: { type: number, nullable: true }
        oeePct: { type: number, nullable: true }
        notes:
          type: array
          items: { type: string }
          description: Human-readable reasons for any null value above.

    OeeAggregateResult:
      type: object
      description: >
        Aggregated OEE across a set of logs, computed from summed numerators/denominators
        (not an average of each log's oeePct) — see README "Aggregation".
      properties:
        logCount: { type: integer }
        totals:
          type: object
          properties:
            availability:
              type: object
              properties:
                plannedMinutes: { type: number }
                downtimeMinutes: { type: number }
                runTimeMinutes: { type: number }
            performance:
              type: object
              properties:
                totalOutputQty: { type: number }
                standardOutput: { type: number }
            quality:
              type: object
              properties:
                goodQty: { type: number }
                totalOutputQty: { type: number }
        availabilityPct: { type: number, nullable: true }
        performancePct: { type: number, nullable: true }
        qualityPct: { type: number, nullable: true }
        oeePct: { type: number, nullable: true }
        excludedLogsCount:
          type: object
          description: Number of logs excluded from each component's sums for lacking that component's data.
          properties:
            availability: { type: integer }
            performance: { type: integer }
            quality: { type: integer }

    BomExplosionLine:
      type: object
      properties:
        partId: { type: string, nullable: true }
        partName: { type: string }
        qtyPerUnit:
          type: number
          description: >
            qty_per_unit of the BOM row where this line was first encountered, relative to its
            immediate parent SKU — see README for the aggregation caveat when a part is reached
            via more than one path.
        requiredQty: { type: number, description: Fully multiplied total required for the exploded qty. }
        sourceSku: { type: string, description: Immediate parent SKU whose BOM produced this line. }
        level: { type: integer, description: '0 = direct component of the top-level SKU; deeper otherwise.' }

    BomExplosionResult:
      type: object
      description: Ad-hoc explosion result — see GET /bom-explosion/sku/{sku}.
      properties:
        sku: { type: string }
        qty: { type: number }
        totalLines: { type: integer }
        maxDepthReached: { type: integer }
        lines:
          type: array
          items: { $ref: '#/components/schemas/BomExplosionLine' }

    OrderBomLine:
      type: object
      properties:
        id: { type: integer }
        partId: { type: string, nullable: true }
        partName: { type: string }
        qtyPerUnit: { type: number }
        requiredQty: { type: number }

    OrderBomSnapshot:
      type: object
      description: A cached (or freshly computed) order_bom_requirements snapshot for one order.
      properties:
        orderId: { type: string }
        sku: { type: string }
        qty: { type: number }
        computedAt:
          type: string
          format: date-time
          nullable: true
          description: Null only when the order's SKU has zero BOM rows — see README.
        totalLines: { type: integer }
        lines:
          type: array
          items: { $ref: '#/components/schemas/OrderBomLine' }

    CtbShortage:
      type: object
      properties:
        partId: { type: string, nullable: true }
        partName: { type: string }
        requiredQty: { type: number }
        availableStock: { type: number }
        shortQty: { type: number, description: 'max(0, requiredQty - availableStock)' }

    CtbOrderResult:
      type: object
      properties:
        orderId: { type: string }
        sku: { type: string }
        qty: { type: number }
        ctbStatus: { type: string, enum: ['Clear To Build', 'RM Shortage'] }
        ctbCheckedAt: { type: string, format: date-time }
        evaluatedLive:
          type: boolean
          description: >
            true if this response just ran a fresh evaluation (authoritative shortages); false if
            served from the freshness-window cache — see README "Module 6".
        shortages:
          type: array
          items: { $ref: '#/components/schemas/CtbShortage' }

    CtbDashboardRow:
      type: object
      properties:
        orderId: { type: string }
        sku: { type: string }
        qty: { type: number }
        status: { type: string, description: Order status (Module 2 enum). }
        ctbStatus: { type: string, enum: ['Clear To Build', 'RM Shortage'], nullable: true }
        ctbCheckedAt: { type: string, format: date-time, nullable: true }
        neverChecked: { type: boolean }
        shortages:
          type: array
          items: { $ref: '#/components/schemas/CtbShortage' }
          description: Populated only when ctbStatus is 'RM Shortage'.

    RecheckAllSummary:
      type: object
      properties:
        totalEvaluated: { type: integer }
        clearToBuildCount: { type: integer }
        rmShortageCount: { type: integer }

    AffectedOrder:
      type: object
      properties:
        orderId: { type: string }
        client: { type: string }
        priority: { type: string, enum: [Low, Medium, High] }
        dueDate: { type: string, format: date, nullable: true }
        shortQty: { type: number }
        ctbCheckedAt:
          type: string
          format: date-time
          nullable: true
          description: How fresh this order's shortage figure is — see README "Module 7".

    PartShortageSummary:
      type: object
      properties:
        partId: { type: string, nullable: true }
        partName: { type: string }
        totalShortQty: { type: number }
        affectedOrderCount: { type: integer }
        highestPriority: { type: string, enum: [Low, Medium, High] }
        affectedOrders:
          type: array
          items: { $ref: '#/components/schemas/AffectedOrder' }

    CriticalPartRow:
      type: object
      properties:
        partId: { type: string }
        partName: { type: string }
        stock: { type: number }
        criticalThreshold: { type: number }
        deficit: { type: number, description: 'criticalThreshold - stock; always >= 0 on this endpoint.' }

    MaterialsSummary:
      type: object
      properties:
        totalShortagePartsCount: { type: integer }
        totalCriticalPartsCount: { type: integer }
        totalAffectedOrdersCount: { type: integer }
        affectedOrdersByPriority:
          type: object
          properties:
            High: { type: integer }
            Medium: { type: integer }
            Low: { type: integer }

    MaterialPartDetail:
      type: object
      properties:
        partId: { type: string }
        partName: { type: string }
        stock: { type: number }
        criticalThreshold: { type: number, nullable: true }
        deficit:
          type: number
          nullable: true
          description: criticalThreshold - stock (unclamped, can be negative); null when no threshold is set.
        totalShortQty: { type: number }
        affectedOrders:
          type: array
          items: { $ref: '#/components/schemas/AffectedOrder' }
        recentTransactions:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              delta: { type: number }
              reason: { type: string, nullable: true }
              createdAt: { type: string, format: date-time }

    MissingComponent:
      type: object
      properties:
        partId: { type: string, nullable: true }
        partName: { type: string }
        requiredQty: { type: number }
        availableStock: { type: number }
        procurementRequiredQty: { type: number, description: "Module 6's shortQty, renamed for this report — see README." }

    OrderShortageReportRow:
      type: object
      properties:
        orderId: { type: string }
        client: { type: string }
        sku: { type: string }
        product: { type: string }
        qty: { type: number }
        dueDate: { type: string, format: date, nullable: true }
        priority: { type: string, enum: [Low, Medium, High] }
        status: { type: string, description: Order status (Module 2 enum). }
        ctbCheckedAt: { type: string, format: date-time, nullable: true }
        missingComponents:
          type: array
          items: { $ref: '#/components/schemas/MissingComponent' }
        urgencyScore: { type: number }
        isOverdue: { type: boolean }
        daysToDue: { type: integer, nullable: true }
        shortagePct:
          type: number
          description: Severity among the order's short components only, not overall BOM completeness — see README.

    SingleOrderShortageReport:
      type: object
      properties:
        orderId: { type: string }
        reportStatus: { type: string, enum: [reported, not_in_shortage, never_checked, closed] }
        report:
          allOf:
            - $ref: '#/components/schemas/OrderShortageReportRow'
          nullable: true
          description: Populated only when reportStatus is 'reported'.

    PrLineItem:
      type: object
      properties:
        id: { type: integer }
        prId: { type: integer }
        partId: { type: string, nullable: true }
        partName: { type: string }
        totalRequiredQty: { type: number, description: Summed across every non-Closed order's BOM requirement. }
        currentStockQty: { type: number }
        netRequirementQty: { type: number, description: "max(0, totalRequiredQty - currentStockQty); only rows > 0 are ever stored." }

    PrStatusHistoryEntry:
      type: object
      properties:
        id: { type: integer }
        prId: { type: integer }
        oldStatus: { type: string, enum: [Draft, Sent, Approved, Fulfilled, Cancelled], nullable: true }
        newStatus: { type: string, enum: [Draft, Sent, Approved, Fulfilled, Cancelled] }
        changedBy: { type: string, nullable: true }
        changedAt: { type: string, format: date-time }

    PurchaseRequisition:
      type: object
      properties:
        id: { type: integer }
        prNumber: { type: string, example: PR-20260801-01 }
        status: { type: string, enum: [Draft, Sent, Approved, Fulfilled, Cancelled] }
        generatedBy: { type: string, nullable: true }
        generatedAt: { type: string, format: date-time }
        notes: { type: string, nullable: true }
        lineItems:
          type: array
          items: { $ref: '#/components/schemas/PrLineItem' }
        statusHistory:
          type: array
          items: { $ref: '#/components/schemas/PrStatusHistoryEntry' }

    GeneratePrResult:
      type: object
      properties:
        created: { type: boolean }
        message: { type: string }
        purchaseRequisition:
          allOf:
            - $ref: '#/components/schemas/PurchaseRequisition'
          nullable: true
          description: Null when created is false (no shortfall across any active order).

    ScheduledAssignment:
      type: object
      properties:
        orderId: { type: string }
        sku: { type: string }
        productType: { type: string }
        qty: { type: integer }
        lineId: { type: string }
        lineName: { type: string }
        dailyOutput: { type: number }
        workersPresent: { type: integer }
        workersRequired: { type: integer }
        daysNeeded: { type: integer }
        startDate: { type: string, format: date }
        estEndDate: { type: string, format: date }
        dueDate: { type: string, format: date, nullable: true }
        slackDays: { type: integer, nullable: true, description: Null when the order has no dueDate. }
        status: { type: string, enum: ['On Track', 'At Risk'] }

    UnscheduledOrder:
      type: object
      properties:
        orderId: { type: string }
        reason: { type: string, enum: [no_compatible_line, no_feasible_line] }

    FailedAssignment:
      type: object
      description: >
        An order the engine chose to schedule but whose production_schedule row and/or Open ->
        Scheduled transition then failed to persist (dryRun: false only — always empty for a dry
        run). Recorded explicitly, per order, rather than aborting the rest of the batch — see
        README "Module 10: partial-failure handling".
      properties:
        orderId: { type: string }
        error: { type: string, description: The underlying error's message. }

    RunSchedulingResult:
      type: object
      properties:
        scheduled:
          type: array
          items: { $ref: '#/components/schemas/ScheduledAssignment' }
          description: Successfully persisted assignments when dryRun is false; the full proposed set when dryRun is true.
        unscheduled:
          type: array
          items: { $ref: '#/components/schemas/UnscheduledOrder' }
        failed:
          type: array
          items: { $ref: '#/components/schemas/FailedAssignment' }
          description: Always empty when dryRun is true.
        summary:
          type: object
          properties:
            totalEligible: { type: integer }
            scheduledCount: { type: integer }
            unscheduledCount: { type: integer }
            failedCount: { type: integer }

    ProductionScheduleRow:
      type: object
      properties:
        id: { type: integer }
        orderId: { type: string }
        client: { type: string }
        sku: { type: string }
        product: { type: string }
        qty: { type: integer }
        lineId: { type: string, nullable: true }
        lineName: { type: string, nullable: true }
        dailyOutput: { type: number, nullable: true }
        workersPresent: { type: integer, nullable: true }
        workersRequired: { type: integer, nullable: true }
        shiftMode: { type: string, nullable: true }
        daysNeeded: { type: number, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        estEndDate: { type: string, format: date, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        slackDays: { type: integer, nullable: true }
        status: { type: string, enum: [OnTrack, AtRisk, RMShortage] }
        createdAt: { type: string, format: date-time }

    DailyProductionPlanRow:
      type: object
      description: >
        Client Flow Part 2. One row per calendar day of an order's schedule span — see README
        "Client Flow Part 2".
      properties:
        id: { type: integer }
        orderId: { type: string }
        planDate: { type: string, format: date }
        lineId: { type: string, nullable: true, description: Populated from the schedule's assigned line. }
        machineId:
          type: string
          nullable: true
          description: Always null today — machine-level scheduling assignment isn't built yet. See README.
        plannedQty: { type: number }

    PlanVsActualDay:
      type: object
      properties:
        date: { type: string, format: date }
        plannedQty: { type: number }
        actualQty: { type: number, description: Summed totalOutputQty across every daily log matching this orderId+date. }
        gap: { type: number, description: 'actualQty - plannedQty (negative = shortfall).' }
        achievementPct:
          type: number
          nullable: true
          description: 'actualQty / plannedQty * 100. Null only if plannedQty is 0 (divide-by-zero guard).'
        gapReasons:
          type: array
          description: Downtime reasons (Module 3's downtime_log, same vocabulary) from the matching daily log(s), summed per reason.
          items:
            type: object
            properties:
              reason:
                type: string
                enum:
                  [
                    Material Not Available,
                    Machine Breakdown,
                    Changeover Activity,
                    Operator Unavailable,
                    Power Failure,
                    Other,
                  ]
              totalMinutes: { type: number }
        noDataLogged:
          type: boolean
          description: >
            true if no daily_production_log row at all matched this orderId+date (a data-entry gap,
            distinct from a matching log that genuinely recorded zero output). See README.

    PlanVsActualResult:
      type: object
      properties:
        orderId: { type: string }
        days:
          type: array
          items: { $ref: '#/components/schemas/PlanVsActualDay' }
        summary:
          type: object
          properties:
            cumulativePlannedQty: { type: number }
            cumulativeActualQty: { type: number }
            overallAchievementPct:
              type: number
              nullable: true
              description: Computed from cumulative sums, not an average of each day's achievementPct — same convention as Module 4's OEE aggregation.

    CompletionForecastResult:
      type: object
      description: >
        Client Flow Part 4A — the QC-Adjusted Completion Forecast. NOT the same as Module 11's
        At-Risk/On-Track schedule-based prediction (AtRiskOrderRow below) — this one projects from
        actual accepted (QC-passed) production. See README "Client Flow Part 4".
      properties:
        orderId: { type: string }
        balanceQty: { type: number, description: order.qty - acceptedProductionQty (Part 3). }
        currentAvgDailyAccepted:
          type: number
          description: Average passedQty per calendar day across the trailing windowDaysUsed-day window.
        remainingProductionDays:
          type: number
          nullable: true
          description: 'balanceQty / currentAvgDailyAccepted. Null only when currentAvgDailyAccepted is 0 (no recent accepted production) — see noDataReason.'
        expectedCompletionDate: { type: string, format: date, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        isDelayedByForecast:
          type: boolean
          nullable: true
          description: 'expectedCompletionDate > dueDate. Null if there is no dueDate, or no forecast could be computed at all.'
        windowDaysUsed: { type: integer, example: 7, description: COMPLETION_FORECAST_WINDOW_DAYS at call time. }
        noDataReason:
          type: string
          description: Present only when remainingProductionDays is null — explains why no projection could be made.

    AtRiskOrderRow:
      type: object
      properties:
        orderId: { type: string }
        client: { type: string }
        priority: { type: string, enum: [Low, Medium, High] }
        dueDate: { type: string, format: date, nullable: true }
        lineId: { type: string, nullable: true }
        lineName: { type: string, nullable: true }
        qty: { type: integer }
        dailyOutput: { type: number, nullable: true }
        daysNeeded: { type: number, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        estEndDate: { type: string, format: date, nullable: true }
        slackDays: { type: integer, nullable: true }
        status: { type: string, enum: [OnTrack, AtRisk, RMShortage] }

    RecommendationOption:
      type: object
      description: >
        A planning estimate for one of three levers (Overtime / Extended Shift / Additional Line),
        never a guaranteed outcome — see isEstimate and the top-level disclaimer on
        RiskRecommendationsResult.
      properties:
        option: { type: string, enum: [Overtime, Extended Shift, Additional Line] }
        isEstimate: { type: boolean, example: true }
        applicable: { type: boolean }
        reason: { type: string, description: Present only when applicable is false. }
        newDailyOutput: { type: number, description: Present only when applicable is true. }
        newDaysNeeded: { type: integer }
        newEstEndDate: { type: string, format: date }
        newSlackDays: { type: integer }
        closesGap: { type: boolean, description: "newSlackDays >= 0." }
        recommendedLineId: { type: string, description: Additional Line only. }
        recommendedLineName: { type: string, description: Additional Line only. }
        otherFeasibleLineCount: { type: integer, description: "Additional Line only — count of other feasible candidates besides the recommended one." }

    RiskRecommendationsResult:
      type: object
      properties:
        orderId: { type: string }
        currentSlackDays: { type: integer, description: Module 10's already-stored slackDays — read, not recomputed. }
        options:
          type: array
          items: { $ref: '#/components/schemas/RecommendationOption' }
        disclaimer: { type: string }

    AtRiskRecommendationsReport:
      type: object
      properties:
        orderId: { type: string }
        reportStatus: { type: string, enum: [reported, not_scheduled, not_at_risk] }
        recommendations:
          allOf:
            - $ref: '#/components/schemas/RiskRecommendationsResult'
          nullable: true
          description: Populated only when reportStatus is 'reported'.

    RiskSummary:
      type: object
      properties:
        totalAtRisk: { type: integer }
        totalOnTrack: { type: integer }
        atRiskByPriority:
          type: object
          properties:
            High: { type: integer }
            Medium: { type: integer }
            Low: { type: integer }

    OrderSearchResult:
      type: object
      properties:
        orderId: { type: string }
        client: { type: string }
        sku: { type: string }
        product: { type: string }
        qty: { type: integer }
        dueDate: { type: string, format: date, nullable: true }
        currentStage: { type: string, description: Exactly order.status (Module 2's enum). }
        materialStatus: { type: string, nullable: true, description: Exactly order.ctbStatus (Module 6's enum). }
        pendingQty:
          nullable: true
          description: >
            Always null today — no schema linkage exists between production output and a specific
            order. See README "Module 12" (the pendingQty gap) before assuming this can be
            populated.
        pendingQtyNote: { type: string }
        expectedCompletionDate: { type: string, format: date, nullable: true, description: Module 10's production_schedule.est_end_date, if a schedule row exists. }
        expectedCompletionDateNote: { type: string, nullable: true, description: Set when expectedCompletionDate is null (not yet scheduled). }

    ProductSearchResult:
      type: object
      properties:
        modelId: { type: string }
        sku: { type: string }
        modelName: { type: string }
        productType: { type: string }

    LineSearchResult:
      type: object
      properties:
        lineId: { type: string }
        lineName: { type: string }

    SearchResponse:
      type: object
      properties:
        query: { type: string }
        orders:
          type: array
          items: { $ref: '#/components/schemas/OrderSearchResult' }
        products:
          type: array
          items: { $ref: '#/components/schemas/ProductSearchResult' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/LineSearchResult' }

    TestingPlan:
      type: object
      properties:
        id: { type: integer }
        productType: { type: string, example: OTG }
        planName: { type: string }
        description: { type: string, nullable: true }

    QcBatch:
      type: object
      properties:
        id: { type: integer }
        orderId: { type: string }
        sku: { type: string }
        batchNumber: { type: string, example: BATCH-20260801-01 }
        barcodeValue:
          type: string
          description: The barcode's data payload only (== batchNumber) — no barcode image is generated. See README "Module 13".
        serialRangeStart: { type: integer }
        serialRangeEnd: { type: integer }
        testingPlanId: { type: integer, nullable: true }
        generatedAt: { type: string, format: date-time }

    QcBatchDetail:
      allOf:
        - $ref: '#/components/schemas/QcBatch'
        - type: object
          properties:
            order:
              type: object
              properties:
                orderId: { type: string }
                client: { type: string }
                sku: { type: string }
                product: { type: string }
                qty: { type: integer }
                status: { type: string }
                dueDate: { type: string, format: date, nullable: true }
            testingPlan:
              allOf:
                - $ref: '#/components/schemas/TestingPlan'
              nullable: true

    GeneratedQcBatch:
      type: object
      properties:
        orderId: { type: string }
        batchNumber: { type: string }
        barcodeValue: { type: string }
        serialRangeStart: { type: integer }
        serialRangeEnd: { type: integer }
        testingPlanId: { type: integer, nullable: true }

    GenerateQcBatchesResult:
      type: object
      properties:
        generated:
          type: array
          items: { $ref: '#/components/schemas/GeneratedQcBatch' }
        skipped:
          type: array
          items:
            type: object
            properties:
              orderId: { type: string }
              reason: { type: string }
        failed:
          type: array
          items:
            type: object
            properties:
              orderId: { type: string }
              error: { type: string }
        warnings:
          type: array
          items:
            type: object
            properties:
              orderId: { type: string }
              message: { type: string }
        summary:
          type: object
          properties:
            totalEligible: { type: integer }
            generatedCount: { type: integer }
            skippedCount: { type: integer }
            failedCount: { type: integer }

    DailyQcInspection:
      type: object
      description: >
        Client Flow Part 3. Daily QC inspection results — UNRELATED to QcBatch above despite the
        shared "QC" name; see README "QC Batches vs. QC Inspections" before touching either.
      properties:
        id: { type: integer }
        orderId: { type: string }
        inspectionDate: { type: string, format: date }
        dailyLogId:
          type: string
          nullable: true
          description: Optional link to a daily_production_log row — validated to exist and belong to the same orderId, not a DB-level FK.
        producedQty: { type: number }
        sampleQty: { type: number, nullable: true }
        passedQty: { type: number }
        rejectedQty: { type: number }
        reworkQty: { type: number, default: 0 }
        defectType: { type: string, nullable: true }
        qcStatus:
          type: string
          enum: [Pending, Passed, PartialPass, Rejected]
          readOnly: true
          description: Always server-derived from passedQty/rejectedQty/reworkQty — never accepted from the request body. See README.
        remarks: { type: string, nullable: true }
        inspectorName: { type: string }
        createdAt: { type: string, format: date-time }

    QcInspectionSummary:
      type: object
      properties:
        orderId: { type: string }
        totalProducedQty: { type: number }
        totalPassedQty: { type: number }
        totalRejectedQty: { type: number }
        totalReworkQty: { type: number }
        acceptedProductionQty:
          type: number
          description: Exactly totalPassedQty — the client's "Accepted Production" concept, named explicitly. Consumed by Part 4's completion prediction.
        overallPassRatePct:
          type: number
          nullable: true
          description: 'totalPassedQty / totalProducedQty * 100. Null only if totalProducedQty is 0.'

    ProductionPeriodRow:
      type: object
      properties:
        periodLabel: { type: string, format: date-time, description: The truncated period start (date_trunc'd by day/week/month). }
        totalOutputQty: { type: number }
        totalGoodQty: { type: number }
        avgAttendancePct: { type: number, nullable: true }

    PlanningHealth:
      type: object
      description: >
        A current-state snapshot — no date range. See README "Module 14" for why Delayed and At
        Risk are deliberately two independent queries against two different signals.
      properties:
        scheduledCount: { type: integer }
        delayedCount: { type: integer, description: Lagging indicator — dueDate already passed, status not yet Dispatch Ready/Closed. Computed fresh, not the stored At Risk flag. }
        atRiskCount: { type: integer, description: Module 10/11's forward-looking slack projection (production_schedule.status = 'At Risk'), reused directly via Module 11's getRiskSummary(). }

    MaterialsHealth:
      type: object
      properties:
        ctbBreakdown:
          type: object
          properties:
            clearCount: { type: integer }
            shortageCount: { type: integer }
            neverCheckedCount: { type: integer }
        rmShortagePartsCount: { type: integer, description: Reused directly from Module 7's getMaterialsSummary(). }
        procurementStatusBreakdown:
          type: object
          properties:
            Draft: { type: integer }
            Sent: { type: integer }
            Approved: { type: integer }
            Fulfilled: { type: integer }
            Cancelled: { type: integer }

    ManagementMetrics:
      type: object
      description: >
        See README "Module 14" for the four metric definitions — OEE and Capacity Utilization are
        the SAME underlying number as Module 4's oeePct/performancePct; Production Efficiency and
        Delivery Performance are genuinely different, newly-computed metrics.
      properties:
        oeePct: { type: number, nullable: true, description: Exactly Module 4's aggregate oeePct for this range. }
        capacityUtilizationPct: { type: number, nullable: true, description: Exactly Module 4's aggregate performancePct for this range — same number, different label. }
        productionEfficiencyPct: { type: number, description: Output-weighted average of production_lines.efficiencyPct — see calculateWeightedEfficiency. }
        deliveryPerformancePct: { type: number, description: On-time Dispatch Ready completion rate — see calculateOnTimeRate. }
        detail:
          type: object
          description: Supporting counts/sums so the four top-level numbers are auditable, not opaque.
          properties:
            oee: { type: object, description: Module 4's full OeeAggregateResult (totals, excludedLogsCount, etc.). }
            productionEfficiency:
              type: object
              properties:
                lineCount: { type: integer }
                lines:
                  type: array
                  items:
                    type: object
                    properties:
                      lineId: { type: string }
                      lineName: { type: string }
                      efficiencyPct: { type: number }
                      totalOutputQty: { type: number }
            deliveryPerformance:
              type: object
              properties:
                rate: { type: number }
                onTimeCount: { type: integer }
                totalCount: { type: integer }
                excludedNoDueDateCount: { type: integer }

    DashboardOverview:
      type: object
      properties:
        production:
          type: array
          items: { $ref: '#/components/schemas/ProductionPeriodRow' }
        planning: { $ref: '#/components/schemas/PlanningHealth' }
        materials: { $ref: '#/components/schemas/MaterialsHealth' }
        management: { $ref: '#/components/schemas/ManagementMetrics' }

    OrderStatusDashboardRow:
      type: object
      description: >
        Client Flow Part 5 (final part). A pure composition row — every field is read or reused
        from an existing module/part, never independently recomputed. See README "Client Flow
        Part 5" for the full source-of-each-field table and the status-badge precedence table.
      properties:
        orderId: { type: string }
        client: { type: string }
        sku: { type: string }
        product: { type: string }
        qty: { type: integer }
        priority: { type: string, enum: [Low, Medium, High] }
        dueDate: { type: string, format: date, nullable: true }
        status:
          type: string
          enum: [Open, PendingRM, Scheduled, Running, QC, DispatchReady]
          description: Module 2's order status. Closed orders never appear — this endpoint lists non-Closed orders only.
        line:
          type: object
          nullable: true
          description: From production_schedule (Module 10), if the order has been scheduled.
          properties:
            lineId: { type: string }
            lineName: { type: string, nullable: true }
        machines:
          type: array
          items: { type: string }
          description: >
            Always [] today. daily_production_log has no machineId column — Part 1's actual scope
            never added one (only orderId/rejectedQty/reworkQty) — so there is no per-log machine
            data to draw from. Not a bug; see README "Client Flow Part 5".
        plan:
          type: number
          nullable: true
          description: Cumulative planned qty THROUGH TODAY (Part 2's getCumulativePlannedQtyToDate). Null if no plan has been generated yet.
        actual: { type: number, description: Cumulative actual production to date — sum of daily_production_log.totalOutputQty for this order. }
        qc:
          type: object
          description: Part 3's cumulative QC summary, reused as-is.
          properties:
            passedQty: { type: number }
            rejectedQty: { type: number }
            reworkQty: { type: number }
        balanceQty:
          type: number
          description: Taken directly from Part 4A's CompletionForecastResult.balanceQty (qty - acceptedProductionQty) — never recomputed here.
        expectedCompletionDate:
          type: string
          format: date
          nullable: true
          description: From Part 4A's forecast; null if no forecast could be computed yet (see CompletionForecastResult.noDataReason).
        statusBadge:
          type: string
          enum: ['🟢 On Track', '🟡 At Risk', '🔴 Delayed', '🔵 QC Pending', '✅ Completed']
          description: Derived by strict precedence (most urgent wins) — see README "Client Flow Part 5" for the full table.

    Warehouse:
      type: object
      description: FG Module Part 1. New, lightweight master data — see README "FG Module Part 1".
      properties:
        warehouseId: { type: string, example: WH-01 }
        warehouseName: { type: string }
        location: { type: string, nullable: true }
        isActive: { type: boolean, default: true }

    FgBatch:
      type: object
      description: >
        FG Module Part 1. Created ONLY via POST /fg-batches/generate — never a direct manual
        quantity entry. See README "FG Module Part 1" for the full generation/derivation design.
      properties:
        id: { type: integer, readOnly: true }
        fgBatchNo: { type: string, readOnly: true, example: FG-20260818-01, description: Generated via the shared sequential-id scheme (Module 3/9), sequenced off productionDate. }
        productionOrderId: { type: string, readOnly: true, description: Always derived from the QC inspection's own order — never client-supplied. }
        qcInspectionId: { type: integer, readOnly: true, description: 'Unique: an inspection can produce at most one FG batch, ever.' }
        salesOrderId: { type: integer, nullable: true, description: No SalesOrder table exists yet in this codebase — plain optional reference for a future part. }
        customer: { type: string, nullable: true, readOnly: true, description: order.client at generation time. }
        productName: { type: string, readOnly: true, description: order.product at generation time. }
        sku: { type: string, readOnly: true, description: order.sku at generation time. }
        plywoodGrade:
          type: string
          nullable: true
          enum: [MR, BWR, BWP, Other]
          description: Defaults from the product's own plywoodGrade; overridable per batch at generation time.
        thickness: { type: number, nullable: true, description: mm. Defaults from the product; overridable. }
        sheetLength: { type: number, nullable: true, description: mm. Defaults from the product; overridable. }
        sheetWidth: { type: number, nullable: true, description: mm. Defaults from the product; overridable. }
        productionDate: { type: string, format: date, description: Defaults to the QC inspection's own inspectionDate; overridable. }
        producedQty: { type: number, readOnly: true, description: Copied from the triggering QC inspection. }
        qcPassedQty: { type: number, readOnly: true, description: Copied from the triggering QC inspection's passedQty. }
        reworkQty: { type: number, readOnly: true, description: Copied from the triggering QC inspection. }
        rejectedQty: { type: number, readOnly: true, description: Copied from the triggering QC inspection. }
        qcStatus:
          type: string
          enum: [Pending, Pass, Fail, Hold]
          description: Always Pass on generate (this endpoint only ever fires from a real passedQty). Fail/Hold are set later via Part 2's hold mechanism, not at creation.
        warehouseId: { type: string, nullable: true, description: 'Plain, service-validated string — no DB-level FK. Set at generation or (Part 2+) reassigned later.' }
        rackBinLocation: { type: string, nullable: true }
        reservedQty: { type: number, readOnly: true, description: Always 0 at generation — only Part 2's future reservation actions ever change this. }
        dispatchedQty: { type: number, readOnly: true, description: Always 0 at generation — only Part 4's future dispatch actions ever change this. }
        availableQty:
          type: number
          readOnly: true
          description: >
            NEVER a stored column — always computed as qcPassedQty - reservedQty - dispatchedQty at
            read time (see README "FG Module Part 1"), so it can never drift from its components.
        stockStatus:
          type: string
          enum: [Available, Reserved, Hold]
          description: Always Available at generation.
        dispatchStatus:
          type: string
          enum: [NotReady, Ready, Partial, Dispatched]
          description: Always Ready at generation — a freshly QC-passed batch is immediately dispatch-eligible unless a later part puts it on hold.
        createdBy: { type: string, readOnly: true, description: 'The authenticated caller''s name — never client-supplied.' }
        createdAt: { type: string, format: date-time, readOnly: true }
        order:
          type: object
          readOnly: true
          description: Detail endpoint only — the linked production order's basic info, inlined so the UI doesn't need a second lookup.
          properties:
            orderId: { type: string }
            client: { type: string }
            sku: { type: string }
            product: { type: string }
            qty: { type: integer }
            status: { type: string }
            dueDate: { type: string, format: date, nullable: true }
        qcInspectionSummary:
          type: object
          readOnly: true
          description: Detail endpoint only — the triggering QC inspection's basic info, inlined.
          properties:
            id: { type: integer }
            inspectionDate: { type: string, format: date }
            producedQty: { type: number }
            passedQty: { type: number }
            rejectedQty: { type: number }
            reworkQty: { type: number }
            inspectorName: { type: string }
            qcStatus: { type: string }

    FgStockMovement:
      type: object
      readOnly: true
      description: >
        FG Module Part 2. One row per audit-ledger event — see README "FG Module Part 2". Written
        ONLY via the shared logFgMovement (fgStockMovement.service.ts), inside the same transaction
        as the state change it documents. Never edited; only cascade-deleted with its parent batch.
      properties:
        id: { type: integer }
        fgBatchId: { type: integer }
        movementType:
          type: string
          enum: [BatchCreated, WarehouseTransfer, Reserved, Unreserved, Dispatched, Held, HoldReleased, Adjustment]
          description: This part writes BatchCreated/WarehouseTransfer/Held/HoldReleased. Reserved/Unreserved/Dispatched are Parts 3-4's; Adjustment is reserved for a future manual-correction path.
        quantity: { type: number, nullable: true, description: 'Null for movement types that do not involve a quantity (Held/HoldReleased).' }
        fromLocation: { type: string, nullable: true, example: 'WH-01 / Rack 3 Bin B', description: 'Human-readable point-in-time snapshot (see formatFgLocation), not a live warehouse lookup.' }
        toLocation: { type: string, nullable: true, example: WH-02 }
        performedBy: { type: string, description: The authenticated caller's name — never client-supplied. }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    SalesOrder:
      type: object
      description: >
        FG Module Part 3. A real entity, superseding (not wired up to) FgBatch.salesOrderId — one
        Sales Order can be fulfilled by several FG batches over time via FgReservation. See README
        "FG Module Part 3".
      properties:
        id: { type: integer, readOnly: true }
        salesOrderNo: { type: string, example: SO-1024, description: Client-supplied, unique. }
        customer: { type: string }
        sku: { type: string }
        orderedQty: { type: number }
        status:
          type: string
          readOnly: true
          enum: [Open, PartiallyReserved, FullyReserved, PartiallyDispatched, Dispatched, Closed]
          description: >
            NEVER client-settable — not even accepted in the request body. Only recomputeSalesOrderStatus
            (called from reserve/cancel/dispatch) ever changes it. Dispatch progress takes precedence
            over reservation progress — see README "FG Module Part 4". Closed is declared but
            unreachable — there is no "close this Sales Order" action in this codebase.
        dueDate: { type: string, format: date, nullable: true }
        createdBy: { type: string, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }

    FgReservation:
      type: object
      readOnly: true
      description: >
        FG Module Part 3. The partial-reservation join row — one per "this much of this FG batch is
        set aside for this Sales Order" event. Never physically deleted; Cancelled rows stay as the
        historical record GET /sales-orders/{salesOrderNo}/reservations reads. See README "FG Module
        Part 3".
      properties:
        id: { type: integer }
        fgBatchId: { type: integer }
        salesOrderId: { type: integer }
        reservedQty: { type: number }
        status:
          type: string
          enum: [Active, Cancelled, Fulfilled]
          description: Fulfilled is set by Part 4's dispatch when this row's reservedQty is fully consumed.
        reservedBy: { type: string, description: The authenticated caller's name — never client-supplied. }
        reservedAt: { type: string, format: date-time }

    FgDispatch:
      type: object
      description: >
        FG Module Part 4. One dispatch EVENT, which can cover several FG batches via its lineItems
        (see FgDispatchLineItem). salesOrderId, unlike the deliberately-unwired FgBatch.salesOrderId,
        gets a real FK to SalesOrder. See README "FG Module Part 4".
      properties:
        id: { type: integer, readOnly: true }
        dispatchNo: { type: string, readOnly: true, example: DSP-20260819-01, description: Generated via the shared sequential-id scheme, sequenced off today (dispatchDate has no override field). }
        salesOrderId: { type: integer, nullable: true, description: Optional — a dispatch can be general/unaffiliated stock movement. }
        dispatchDate: { type: string, format: date, readOnly: true, description: Always today — no override accepted. }
        dispatchedBy: { type: string, readOnly: true, description: The authenticated caller's name — never client-supplied. }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        lineItems:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/FgDispatchLineItem' }

    FgDispatchLineItem:
      type: object
      readOnly: true
      description: >
        FG Module Part 4. One row per FG batch drawn on within a dispatch event — resolved to that
        batch's key info (fgBatchNo/sku/productName) inline, so the UI doesn't need a second lookup.
        quantity is netted against the batch's own reservedQty (for the dispatch's salesOrderId
        specifically) before availableQty — see README "FG Module Part 4" for the exact order.
      properties:
        id: { type: integer }
        fgBatchId: { type: integer }
        fgBatchNo: { type: string }
        sku: { type: string }
        productName: { type: string }
        quantity: { type: number }

paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200':
          description: >
            Login succeeded. Returns { token, user }. token is a JWT bearer
            token, valid for 8 hours, with no refresh token.
        '401': { description: Invalid email or password (generic message either way) }
        '403': { description: This account has been deactivated }

  /auth/me:
    get:
      tags: [Auth]
      responses:
        '200': { description: The authenticated user, re-fetched fresh from the database }
        '401': { description: Missing, invalid, or expired token }

  /auth/users:
    post:
      tags: [Auth]
      description: >
        Admin only. securityQuestion/securityAnswer are required for every
        new user — see "Self-Service Password Reset". securityAnswer is
        never stored or returned as-is; it's normalized (trimmed,
        lowercased) and bcrypt-hashed into securityAnswerHash.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, role, securityQuestion, securityAnswer]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
                name: { type: string }
                role: { type: string, enum: [Admin, StoreManager, ProductionManager] }
                securityQuestion:
                  type: string
                  enum:
                    - What was the name of your first pet?
                    - What city were you born in?
                    - What was your school's name?
                    - What is your mother's maiden name?
                securityAnswer: { type: string, minLength: 1 }
      responses:
        '201': { description: Created (never includes passwordHash or securityAnswerHash) }
        '400': { description: Validation error }
        '401': { description: Missing, invalid, or expired token }
        '403': { description: Caller is not Admin }
        '409': { description: Email already in use }
    get:
      tags: [Auth]
      description: Admin only.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: role
          in: query
          schema: { type: string, enum: [Admin, StoreManager, ProductionManager] }
      responses:
        '200': { description: Paginated list of users (never includes passwordHash) }
        '401': { description: Missing, invalid, or expired token }
        '403': { description: Caller is not Admin }

  /auth/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Auth]
      description: >
        Admin only. Prefer deactivating (isActive: false) over any kind of
        delete — there is no delete endpoint for users, so attribution
        fields (changedBy/savedBy/generatedBy) recorded against a user stay
        intact in the audit trail. securityQuestion/securityAnswer are
        optional but must be provided together — this is how an Admin fixes
        a legacy account still holding the SECURITY_QUESTION_NOT_SET
        sentinel (see "Self-Service Password Reset"); there is no
        self-service "update my own security question" endpoint in this pass.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role: { type: string, enum: [Admin, StoreManager, ProductionManager] }
                isActive: { type: boolean }
                securityQuestion:
                  type: string
                  enum:
                    - What was the name of your first pet?
                    - What city were you born in?
                    - What was your school's name?
                    - What is your mother's maiden name?
                securityAnswer: { type: string, minLength: 1 }
      responses:
        '200': { description: Updated user (never includes passwordHash or securityAnswerHash) }
        '400': { description: Validation error (e.g. empty body, or securityQuestion without securityAnswer) }
        '401': { description: Missing, invalid, or expired token }
        '403': { description: Caller is not Admin }
        '404': { description: Not found }

  /auth/captcha:
    get:
      tags: [Auth]
      security: []
      description: >
        Public. Generates a simple arithmetic challenge — a basic
        bot-deterrent, not true human verification (see "Self-Service
        Password Reset"). Stateless: the expected answer is encoded in the
        signed, short-lived captchaToken, verified as part of
        POST /auth/forgot-password/verify (there is no standalone
        verify-captcha endpoint).
      responses:
        '200':
          description: >
            { question, captchaToken }. question is e.g. "7 + 12 = ?".
            captchaToken is a JWT valid for 5 minutes.

  /auth/forgot-password/verify:
    post:
      tags: [Auth]
      security: []
      description: >
        Public, rate-limited identically to /auth/login. The actual identity
        check: CAPTCHA (bot deterrence) plus the account's security question
        (proof of ownership), both required. See "Self-Service Password
        Reset" for the generic-failure-message and legacy-account
        (SECURITY_QUESTION_NOT_SET) behavior in detail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, captchaToken, captchaAnswer, securityAnswer]
              properties:
                email: { type: string, format: email }
                captchaToken: { type: string }
                captchaAnswer: { type: number }
                securityAnswer: { type: string, minLength: 1 }
      responses:
        '200':
          description: >
            { resetToken }. A single-use JWT valid for 15 minutes, returned
            directly (no email infrastructure exists yet — see "Self-Service
            Password Reset" for why this is an accepted tradeoff here).
        '400': { description: Validation error }
        '401':
          description: >
            Incorrect CAPTCHA, OR a generic identity-check failure (wrong
            email, wrong security answer, or inactive account — deliberately
            indistinguishable from each other).
        '409': { description: Account exists but has no real security question configured yet (ask an Admin) }
        '429': { description: Too many attempts — same rate limiting as /auth/login }

  /auth/forgot-password/reset:
    post:
      tags: [Auth]
      security: []
      description: Public. Consumes a resetToken issued by /auth/forgot-password/verify.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetToken, newPassword]
              properties:
                resetToken: { type: string }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        '200': { description: Password reset. Every other outstanding unused reset token for this user is also invalidated. }
        '400': { description: Validation error (e.g. newPassword too short) }
        '401': { description: Invalid, expired, already-used, or malformed resetToken }

  /products:
    get:
      tags: [Products]
      parameters:
