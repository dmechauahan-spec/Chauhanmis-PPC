  /bom-explosion/sku/{sku}:
    parameters:
      - name: sku
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [BOM Explosion]
      summary: Ad-hoc BOM explosion for a SKU + qty — no order, no persistence (what-if planning)
      parameters:
        - name: qty
          in: query
          required: true
          schema: { type: number, minimum: 0, exclusiveMinimum: true }
      responses:
        '200':
          description: Flattened, aggregated parts requirement for this SKU at this qty
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BomExplosionResult' }
        '400': { description: qty missing, zero, or negative }
        '404': { description: sku not found }
        '409': { description: BOM cycle or max-depth exceeded in the BOM master data (see README) }

  /bom-explosion/order/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [BOM Explosion]
      summary: Get (or lazily compute + cache) an order's exploded BOM requirement snapshot
      description: >
        Returns the cached order_bom_requirements snapshot if one exists. Otherwise computes it
        from the order's sku/qty, persists it, and returns the fresh result. See README
        "lazy-compute-and-cache".
      responses:
        '200':
          description: The (possibly freshly computed) order BOM requirement snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderBomSnapshot' }
        '404': { description: order not found }
        '409': { description: BOM cycle or max-depth exceeded in the BOM master data (see README) }
    delete:
      tags: [BOM Explosion]
      summary: Clear an order's cached BOM requirement snapshot (does not touch the order itself)
      responses:
        '200': { description: Cache rows deleted (idempotent no-op if none existed) }
        '404': { description: order not found }

  /bom-explosion/order/{orderId}/recompute:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [BOM Explosion]
      summary: Force-recompute an order's BOM requirement, replacing the cached snapshot
      description: >
        Always recalculates fresh from the order's current sku/qty and BOM master data, then
        atomically replaces (deletes + reinserts) the cached order_bom_requirements rows.
      responses:
        '200':
          description: The freshly computed order BOM requirement snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderBomSnapshot' }
        '404': { description: order not found }
        '409': { description: BOM cycle or max-depth exceeded in the BOM master data (see README) }

  /ctb/order/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [CTB]
      summary: Get (or freshness-window-cached) CTB evaluation for an order
      description: >
        Returns the cached ctbStatus/ctbCheckedAt + shortage breakdown if ctbCheckedAt is within
        CTB_FRESHNESS_WINDOW_MS (5 minutes). Otherwise evaluates live against current
        rm_inventory stock, persists the result, and returns it. See README "Module 6".
      responses:
        '200':
          description: The (possibly cached) CTB evaluation for this order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CtbOrderResult' }
        '404': { description: order not found }
        '409': { description: BOM cycle or max-depth exceeded while resolving the requirement (see README) }

  /ctb/order/{orderId}/recheck:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [CTB]
      summary: Force a fresh CTB evaluation, bypassing the freshness-window cache
      responses:
        '200':
          description: The freshly evaluated CTB result for this order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CtbOrderResult' }
        '404': { description: order not found }
        '409': { description: BOM cycle or max-depth exceeded while resolving the requirement (see README) }

  /ctb/dashboard:
    get:
      tags: [CTB]
      summary: All non-Closed orders' current CTB status at a glance (never triggers live evaluation)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: status
          in: query
          description: Order status filter (Module 2 enum). Closed is always excluded regardless of this filter.
          schema: { type: string }
        - name: ctbStatus
          in: query
          schema: { type: string, enum: ['Clear To Build', 'RM Shortage'] }
      responses:
        '200':
          description: Paginated list of CtbDashboardRow
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CtbDashboardRow' }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }

  /ctb/recheck-all:
    post:
      tags: [CTB]
      summary: Bulk-reevaluate CTB for every non-Closed order in one call
      description: >
        The expensive, all-orders live-recompute path — fetches BOM snapshots and rm_inventory
        stock in bulk rather than per part, then writes all results in one transaction. Returns a
        summary only; use GET /ctb/dashboard for per-order detail.
      responses:
        '200':
          description: Bulk re-evaluation summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecheckAllSummary' }

  /materials/shortages:
    get:
      tags: [Materials]
      summary: Material-centric shortage view, grouped by part (reads Module 6's persisted cache only)
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: priority
          in: query
          description: Include only parts with at least one affecting order at or above this priority.
          schema: { type: string, enum: [Low, Medium, High] }
        - name: partId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated list of PartShortageSummary, sorted by highestPriority desc then totalShortQty desc
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PartShortageSummary' }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }

  /materials/critical:
    get:
      tags: [Materials]
      summary: Parts at or below their critical threshold, sorted by deficit desc
      responses:
        '200':
          description: List of CriticalPartRow
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CriticalPartRow' }

  /materials/summary:
    get:
      tags: [Materials]
      summary: Dashboard header counts, composed from the shortages and critical data sources
      responses:
        '200':
          description: MaterialsSummary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaterialsSummary' }

  /materials/{partId}/critical-threshold:
    parameters:
      - name: partId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Materials]
      summary: Set or clear a part's critical stock threshold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                criticalThreshold:
                  type: number
                  nullable: true
                  description: A non-negative number sets the threshold; null clears it.
              required: [criticalThreshold]
      responses:
        '200': { description: Updated RmInventory row }
        '400': { description: criticalThreshold is negative or the wrong type }
        '404': { description: partId not found in rm_inventory }

  /materials/{partId}:
    parameters:
      - name: partId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Materials]
      summary: Single-part detail — stock, threshold/deficit, affected orders, recent stock movement
      responses:
        '200':
          description: MaterialPartDetail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaterialPartDetail' }
        '404': { description: partId not found in rm_inventory }

  /shortage-report/orders:
    get:
      tags: [Shortage Report]
      summary: Full order-wise shortage report, sorted by urgencyScore descending
      description: >
        Non-Closed orders currently in RM Shortage, joined with their order_ctb_shortages rows.
        Never re-runs BOM explosion or CTB evaluation — reads Module 6's persisted output only.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: priority
          in: query
          description: Exact match on the order's own priority.
          schema: { type: string, enum: [Low, Medium, High] }
        - name: overdueOnly
          in: query
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Paginated list of OrderShortageReportRow
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OrderShortageReportRow' }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }

  /shortage-report/orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Shortage Report]
      summary: Single-order shortage report
      description: >
        200 with reportStatus 'not_in_shortage' / 'never_checked' / 'closed' and report: null for an
        order that exists but has nothing to report — only an unknown orderId is a 404.
      responses:
        '200':
          description: SingleOrderShortageReport
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SingleOrderShortageReport' }
        '404': { description: order not found }

  /purchase-requisitions/generate:
    post:
      tags: [Purchase Requisitions]
      summary: Generate a consolidated Purchase Requisition across every active order
      description: >
        Sums every non-Closed order's BOM requirement (via Module 5's snapshot service) per part,
        nets the combined total against rm_inventory ONCE, and creates a Draft PR only if at least
        one part has a net shortfall. Deliberately independent of Modules 6/7/8's per-order CTB
        numbers — see README "Module 9" for why per-order shortage checks understate combined
        demand.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                generatedBy: { type: string }
      responses:
        '200':
          description: No shortfall across any active order — no PR created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneratePrResult' }
        '201':
          description: PR created with one or more line items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeneratePrResult' }

  /purchase-requisitions:
    get:
      tags: [Purchase Requisitions]
      summary: List purchase requisitions
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: status
          in: query
          schema: { type: string, enum: [Draft, Sent, Approved, Fulfilled, Cancelled] }
      responses:
        '200':
          description: Paginated list of PurchaseRequisition (without nested lineItems/statusHistory)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PurchaseRequisition' }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }

  /purchase-requisitions/{prId}:
    parameters:
      - name: prId
        in: path
        required: true
        description: PurchaseRequisition.id (numeric primary key), not prNumber.
        schema: { type: integer }
    get:
      tags: [Purchase Requisitions]
      summary: Full PR detail with line items and status history
      responses:
        '200':
          description: PurchaseRequisition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseRequisition' }
        '404': { description: prId not found }

  /purchase-requisitions/{prId}/status:
    parameters:
      - name: prId
        in: path
        required: true
        schema: { type: integer }
    patch:
      tags: [Purchase Requisitions]
      summary: Transition a PR's status
      description: >
        Draft -> Sent -> Approved -> Fulfilled, strictly sequential. Cancelled is reachable only
        from Draft or Sent — not from Approved or Fulfilled. The "Sent" transition logs normally
        (no real procurement system exists to notify yet); the standard success text is returned
        only in the response message, never simulated as a side effect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newStatus]
              properties:
                newStatus: { type: string, enum: [Draft, Sent, Approved, Fulfilled, Cancelled] }
                changedBy: { type: string }
      responses:
        '200':
          description: Updated PurchaseRequisition plus a human-readable message
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchaseRequisition: { $ref: '#/components/schemas/PurchaseRequisition' }
                  message: { type: string }
        '400': { description: Invalid status transition }
        '404': { description: prId not found }

  /scheduling/run:
    post:
      tags: [Scheduling]
      summary: Run a scheduling pass over every CTB-Clear, unscheduled, non-Closed order
      description: >
        Deterministic, rule-based baseline scheduler (greedy heuristic) — NOT the spec's future AI
        Scheduling Optimizer. Sorts eligible orders by priority then due date and greedily assigns
        each to the best available compatible line. dryRun: true returns the proposed result
        without persisting anything; dryRun: false (default) creates production_schedule rows and
        transitions each scheduled order from Open to Scheduled (reusing Module 2's
        status-transition service). See README "Module 10" for the full capacity formula,
        tie-break chain, and sequential line-availability algorithm.
        Persistence is per-order, not one transaction across the whole batch: if one order's write
        fails partway through, it's recorded in `failed` and the remaining orders in the batch are
        still attempted — a single order's failure never aborts orders processed before or after
        it. See README "Module 10: partial-failure handling".
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun: { type: boolean, default: false }
      responses:
        '200':
          description: RunSchedulingResult
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunSchedulingResult' }

  /scheduling/schedule:
    get:
      tags: [Scheduling]
      summary: List the current schedule
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: lineId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [OnTrack, AtRisk] }
        - name: startDateFrom
          in: query
          schema: { type: string, format: date }
        - name: startDateTo
          in: query
          schema: { type: string, format: date }
        - name: estEndDateFrom
          in: query
          schema: { type: string, format: date }
        - name: estEndDateTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Paginated list of ProductionScheduleRow
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductionScheduleRow' }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }

  /scheduling/schedule/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Scheduling]
      summary: Single order's schedule detail
      responses:
        '200':
          description: ProductionScheduleRow
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionScheduleRow' }
        '404': { description: No schedule row exists for this order }
    delete:
      tags: [Scheduling]
      summary: Un-schedule an order (explicit administrative reversal)
      description: >
        Deletes the production_schedule row and sets orders.status back to Open directly,
        bypassing the normal forward-only transition validator on purpose — a backward move that
        validator correctly refuses as a normal transition. Still writes a complete
        order_status_history row (oldStatus: Scheduled, newStatus: Open) so the audit trail stays
        intact. Only allowed while the order's status is exactly Scheduled. Meant to remain a rare,
        deliberate admin action — see README "Module 10", Design decision #2.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: Stored in the order_status_history row's new notes column. }
                changedBy: { type: string }
      responses:
        '200': { description: Un-scheduled successfully }
        '400': { description: "Order status is not 'Scheduled' — cannot un-schedule" }
        '404': { description: No schedule row exists for this order }

  /production-plan/generate/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Production Plan]
      summary: Generate (or re-generate) the day-by-day production plan
      description: >
        Client Flow Part 2. Explicit, caller-triggered generation — not auto-run from
        POST /scheduling/run, same convention as Module 9's PR generation and Module 13's QC batch
        generation. Reads the order's production_schedule row (startDate, estEndDate, dailyOutput);
        distributes qty across days via planDistributor.ts's distributeDailyPlanQty (every day gets
        min(dailyOutput, remaining) except the last, which always gets exactly what remains, so the
        sum is always exactly the order's qty). Re-generating replaces the existing plan wholesale
        (delete + recreate in one transaction), same pattern as Module 5's recompute endpoint. See
        README "Client Flow Part 2" for the worked examples.
      responses:
        '201':
          description: Plan generated (or replaced)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DailyProductionPlanRow' }
        '404': { description: Unknown orderId }
        '409': { description: 'Order has no production schedule yet, or the schedule is missing startDate/estEndDate/dailyOutput' }

  /production-plan/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Production Plan]
      summary: The day-by-day plan for an order
      responses:
        '200':
          description: Day-by-day plan rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DailyProductionPlanRow' }
        '404': { description: 'Unknown orderId, or no plan has been generated yet (error message points at the generate endpoint)' }

  /production-plan/{orderId}/plan-vs-actual:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Production Plan]
      summary: Daily plan vs. actual comparison
      description: >
        Client Flow Part 2. Joins each planned day against daily_production_log rows sharing the
        same orderId and exact date (the linkage Part 1's daily_production_log.orderId added).
        Multiple same-day entries (e.g. separate shifts) have their totalOutputQty summed. See
        README "Client Flow Part 2" for the noDataLogged distinction and the achievementPct
        divide-by-zero guard.
      responses:
        '200':
          description: PlanVsActualResult
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanVsActualResult' }
        '404': { description: 'Unknown orderId, or no plan has been generated yet' }

  /production-plan/{orderId}/completion-forecast:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Production Plan]
      summary: QC-Adjusted Completion Forecast
      description: >
        Client Flow Part 4A. QC-acceptance-based projection — NOT Module 11's schedule-based
        (slackDays) At-Risk prediction; see README "Client Flow Part 4" before conflating the two.
        Always 200, even with no recent accepted production (CompletionForecastResult.noDataReason
        explains why, rather than an error).
      responses:
        '200':
          description: CompletionForecastResult
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompletionForecastResult' }
        '404': { description: Unknown orderId }

  /risk/at-risk-orders:
    get:
      tags: [Risk]
      summary: List all currently At-Risk orders
      description: >
        Reads Module 10's already-computed production_schedule.status/slackDays directly — never
        recomputes them. Sorted by slackDays ascending (most negative / worst first) by default.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: priority
          in: query
          schema: { type: string, enum: [Low, Medium, High] }
        - name: lineId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated list of AtRiskOrderRow
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AtRiskOrderRow' }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }

  /risk/at-risk-orders/{orderId}/recommendations:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Risk]
      summary: Compute Overtime / Extended Shift / Additional Line recommendations for one order
      description: >
        200 with reportStatus 'not_scheduled' / 'not_at_risk' and recommendations: null for an
        order that exists but has no schedule row, or whose schedule is On Track — only an unknown
        orderId is a 404. See README "Module 11" for the full framing of these as planning
        estimates, not guaranteed outcomes.
      responses:
        '200':
          description: AtRiskRecommendationsReport
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AtRiskRecommendationsReport' }
        '404': { description: order not found }

  /risk/summary:
    get:
      tags: [Risk]
      summary: Quick At-Risk / On-Track counts, computed from the same production_schedule data as /risk/at-risk-orders
      responses:
        '200':
          description: RiskSummary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskSummary' }

  /search:
    get:
      tags: [Search]
      summary: Unified instant search across Orders, Products, and Lines
      description: >
        Trigram-similarity (pg_trgm) fuzzy/partial search, ranked exact-match > prefix-match >
        similarity-score within each entity type, capped at `limit` per type. Order results always
        return pendingQty: null with an explanatory note — see README "Module 12" (the pendingQty
        gap) for why this is not fabricated.
      parameters:
        - name: q
          in: query
          required: true
          description: Minimum 2 characters.
          schema: { type: string, minLength: 2 }
        - name: limit
          in: query
          description: Applies per entity type. Default 5, max 20.
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
      responses:
        '200':
          description: SearchResponse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400': { description: q is missing or shorter than 2 characters }

  /qc/generate:
    post:
      tags: [QC]
      summary: Batch-generate QC data (batch number, barcode value, serial range, testing plan) for newly Scheduled orders
      description: >
        Explicit, separately-triggered action — never an automatic side effect of
        POST /api/scheduling/run. Finds every order with status Scheduled and no qc_batches row
        yet. Per-order try/catch mirrors Module 10's partial-failure handling: one order's failure
        never aborts the rest. A missing testing plan for the order's product type does not block
        batch creation (testingPlanId is set to null) but is surfaced in `warnings`. See README
        "Module 13" for the barcode-value-not-image scope and the sequence-based serial
        reservation's documented small race window.
      responses:
        '200':
          description: GenerateQcBatchesResult
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateQcBatchesResult' }

  /qc/batches:
    get:
      tags: [QC]
      summary: List QC batches
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: orderId
          in: query
          schema: { type: string }
        - name: sku
          in: query
          schema: { type: string }
        - name: batchNumber
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated list of QcBatch
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/QcBatch' }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }

  /qc/batches/{batchNumber}:
    parameters:
      - name: batchNumber
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [QC]
      summary: QC batch detail, including the linked order and testing plan
      responses:
        '200':
          description: QcBatchDetail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QcBatchDetail' }
        '404': { description: batchNumber not found }

  /qc/testing-plans:
    get:
      tags: [Testing Plans]
      summary: List testing plans
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: productType
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated list of TestingPlan
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TestingPlan' }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
    post:
      tags: [Testing Plans]
      summary: Create a testing plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productType, planName]
              properties:
                productType: { type: string }
                planName: { type: string }
                description: { type: string }
      responses:
        '201':
          description: Created TestingPlan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestingPlan' }
        '409': { description: productType already has a testing plan }

  /qc/testing-plans/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Testing Plans]
      summary: Get a testing plan by id
      responses:
        '200':
          description: TestingPlan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestingPlan' }
        '404': { description: id not found }
    patch:
      tags: [Testing Plans]
      summary: Update a testing plan (partial body, at least one field required)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                productType: { type: string }
                planName: { type: string }
                description: { type: string, nullable: true }
      responses:
        '200':
          description: Updated TestingPlan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TestingPlan' }
        '400': { description: No fields provided }
        '404': { description: id not found }
        '409': { description: productType already has a different testing plan }
    delete:
      tags: [Testing Plans]
      summary: Delete a testing plan
      description: Hard delete — qc_batches rows referencing this plan have testingPlanId set to null, not blocked.
      responses:
        '200': { description: Deleted successfully }
        '404': { description: id not found }

  /qc-inspections:
    get:
      tags: [QC Inspections]
      summary: List daily QC inspections, filterable by order and date range
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: orderId
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { description: Paginated list of DailyQcInspection, sorted by inspectionDate desc }
    post:
      tags: [QC Inspections]
      summary: Record a daily QC inspection
      description: >
        Client Flow Part 3. qcStatus is always server-derived from passedQty/rejectedQty/reworkQty
        — any qcStatus in the request body is silently ignored. passedQty + rejectedQty + reworkQty
        may be less than producedQty (partial-sample inspection) but must not exceed it by more
        than 0.01 (rounding tolerance only). dailyLogId, if provided, must exist and belong to the
        same orderId. See README "Client Flow Part 3".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DailyQcInspection' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyQcInspection' }
        '400': { description: 'Quantity sum exceeds producedQty beyond tolerance, or dailyLogId is unknown / belongs to a different order' }
        '404': { description: Unknown orderId }

  /qc-inspections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [QC Inspections]
      summary: Inspection detail
      responses:
        '200':
          description: DailyQcInspection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyQcInspection' }
        '404': { description: Not found }

  /qc-inspections/summary/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [QC Inspections]
      summary: Cumulative QC summary for an order
      description: >
        Client Flow Part 3. acceptedProductionQty is exactly totalPassedQty — the client's
        "Accepted Production" concept — the number Part 4's completion prediction consumes. A
        reusable service function (getQcInspectionSummary), not just this HTTP handler's private
        logic. See README "Client Flow Part 3".
      responses:
        '200':
          description: QcInspectionSummary (all-zero sums and overallPassRatePct null if the order has no inspections yet)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QcInspectionSummary' }
        '404': { description: Unknown orderId }

  /dashboard/production:
    get:
      tags: [Dashboard]
      summary: Output over time, grouped by period
      parameters:
        - name: period
          in: query
          required: true
          schema: { type: string, enum: [daily, weekly, monthly] }
        - name: dateFrom
          in: query
          required: true
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Array of ProductionPeriodRow
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ProductionPeriodRow' }
        '400': { description: Missing/invalid period or date range }

  /dashboard/planning:
    get:
      tags: [Dashboard]
      summary: Scheduling health (current-state snapshot, no date range)
      responses:
        '200':
          description: PlanningHealth
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanningHealth' }

  /dashboard/materials:
    get:
      tags: [Dashboard]
      summary: Material health (current-state snapshot, no date range)
      responses:
        '200':
          description: MaterialsHealth
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaterialsHealth' }

  /dashboard/management:
    get:
      tags: [Dashboard]
      summary: The four management metrics (OEE, Capacity Utilization, Production Efficiency, Delivery Performance)
      description: >
        See README "Module 14" for the precise definitions — OEE and Capacity Utilization are the
        same underlying number as Module 4's oeePct/performancePct, surfaced under a different
        label; Production Efficiency and Delivery Performance are genuinely different metrics.
      parameters:
        - name: dateFrom
          in: query
          required: true
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: ManagementMetrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagementMetrics' }
        '400': { description: Missing/invalid date range }

  /dashboard/overview:
    get:
      tags: [Dashboard]
      summary: All four dashboard sections composed in one call
      description: >
        Calls the same service functions as /production, /planning, /materials, and /management —
        no duplicated logic. The production section always groups daily for this single-call view.
      parameters:
        - name: dateFrom
          in: query
          required: true
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: DashboardOverview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardOverview' }
        '400': { description: Missing/invalid date range }

  /order-status-dashboard:
    get:
      tags: [Order Status Dashboard]
      summary: 'Unified per-order view: Order -> Line -> Machine -> Plan -> Actual -> QC -> Balance -> Expected Completion'
      description: >
        Client Flow Part 5, the final part of the Client Flow addition. A pure composition layer
        (like Module 14's dashboard) — every field is read or reused from Modules 2/10/11 and
        Parts 1-4, never independently recomputed. Lists non-Closed orders only. See README
        "Client Flow Part 5" for the full source-of-each-field table and the statusBadge
        precedence table.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Paginated list of OrderStatusDashboardRow
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OrderStatusDashboardRow' }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }

  /warehouses:
    get:
      tags: [Warehouses]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        '200': { description: Paginated list of warehouses }
    post:
      tags: [Warehouses]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Warehouse' }
      responses:
        '201': { description: Created }
        '400': { description: Validation error }
        '409': { description: Duplicate warehouseId (generic P2002 mapping) }

  /warehouses/{warehouseId}:
    parameters:
      - name: warehouseId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Warehouses]
      responses:
        '200': { description: Warehouse }
        '404': { description: Not found }
    patch:
      tags: [Warehouses]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Warehouse' }
      responses:
        '200': { description: Updated }
        '400': { description: No fields provided }
        '404': { description: Not found }
    delete:
      tags: [Warehouses]
      description: >
        Hard delete. warehouseId on fg_batches has no DB-level FK (see README "FG Module Part
        1"), so this never fails on batches still referencing it — deactivate via isActive: false
        instead if a batch should keep pointing at a real-but-retired record.
      responses:
        '200': { description: Deleted }
        '404': { description: Not found }

  /fg-batches/generate:
    post:
      tags: [FG Batches]
      summary: The ONLY way an FgBatch row is ever created
      description: >
        FG Module Part 1. See README "FG Module Part 1" for the full step-by-step design: order/
        product fields are always derived from the QC inspection's own linked order (never client-
        supplied); plywood attributes default from the product but are overridable per batch;
        fgBatchNo is generated via the shared sequential-id scheme, sequenced off productionDate.
        Requires Admin/ProductionManager — a continuation of QC, not a warehouse action (see the
        role-split judgment call in README).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qcInspectionId]
              properties:
                qcInspectionId: { type: integer, example: 42 }
                warehouseId: { type: string }
                rackBinLocation: { type: string }
                salesOrderId: { type: integer }
                productionDate: { type: string, format: date }
                plywoodGrade: { type: string, enum: [MR, BWR, BWP, Other] }
                thickness: { type: number }
                sheetLength: { type: number }
                sheetWidth: { type: number }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FgBatch' }
        '400': { description: Validation error, including an unknown warehouseId }
        '404': { description: Unknown qcInspectionId (or, defensively, its order) }
        '409': { description: 'passedQty <= 0 on the inspection, or this inspection has already been converted to an FG batch' }

  /fg-batches:
    get:
      tags: [FG Batches]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: productionOrderId
          in: query
          schema: { type: string }
        - name: salesOrderId
          in: query
          schema: { type: integer }
        - name: warehouseId
          in: query
          schema: { type: string }
        - name: qcStatus
          in: query
          schema: { type: string, enum: [Pending, Pass, Fail, Hold] }
        - name: stockStatus
          in: query
          schema: { type: string, enum: [Available, Reserved, Hold] }
        - name: dispatchStatus
          in: query
          schema: { type: string, enum: [NotReady, Ready, Partial, Dispatched] }
      responses:
        '200': { description: Paginated list of FG batches, each including the computed availableQty }

  /fg-batches/dispatch-eligible:
    get:
      tags: [FG Batches]
      summary: The selectable list for POST /fg-dispatches
      description: >
        FG Module Part 4. stockStatus != Hold, qcStatus = Pass, and qcPassedQty - dispatchedQty > 0
        — deliberately NOT restricted to stockStatus = Available, since a Reserved batch is still
        eligible to dispatch against its own reservation. salesOrderId only changes ORDER (batches
        with an Active reservation for it sort first, via reservedForSalesOrderQty desc) — it never
        hides unreserved-but-eligible stock. See README "FG Module Part 4".
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: salesOrderId
          in: query
          schema: { type: integer }
          description: Sort preference only, not a filter — see description above.
      responses:
        '200': { description: Paginated list of FgBatch, each with an added reservedForSalesOrderQty (0 if salesOrderId was omitted or none exists) }

  /fg-batches/{fgBatchNo}:
    parameters:
      - name: fgBatchNo
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [FG Batches]
      responses:
        '200':
          description: FG batch detail, including the linked order and QC inspection's basic info inlined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FgBatch' }
        '404': { description: Not found }

  /fg-batches/{fgBatchNo}/transfer:
    parameters:
      - name: fgBatchNo
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [FG Batches]
      summary: Warehouse/bin transfer
      description: >
        FG Module Part 2. Logs a WarehouseTransfer movement (fromLocation/toLocation both
        formatted via formatFgLocation) in the same transaction as the warehouseId/rackBinLocation
        update. rackBinLocation omitted clears the existing bin rather than carrying it over.
        Requires Admin/StoreManager — see README "FG Module Part 2" for the role split.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warehouseId]
              properties:
                warehouseId: { type: string }
                rackBinLocation: { type: string }
                notes: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FgBatch' }
        '400': { description: Unknown warehouseId }
        '404': { description: Not found }
        '409': { description: The batch has already been fully Dispatched }

  /fg-batches/{fgBatchNo}/hold:
    parameters:
      - name: fgBatchNo
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [FG Batches]
      description: >
        FG Module Part 2. Sets stockStatus=Hold and logs a Held movement (notes doubles as the
        hold reason). A Hold batch must not be reservable/dispatchable — enforced by Parts 3-4,
        not here (see README "FG Module Part 2").
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string, description: Optional hold reason. }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FgBatch' }
        '404': { description: Not found }
        '409': { description: Already on Hold }

  /fg-batches/{fgBatchNo}/release-hold:
    parameters:
      - name: fgBatchNo
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [FG Batches]
      description: >
        FG Module Part 2. Restores stockStatus to Reserved (if reservedQty > 0) or Available
        (otherwise) — recomputed, never defaulted — and logs a HoldReleased movement.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FgBatch' }
        '404': { description: Not found }
        '409': { description: Not currently on Hold }

  /fg-batches/{fgBatchNo}/movements:
    parameters:
      - name: fgBatchNo
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [FG Batches]
      summary: The audit ledger for one batch
      description: FG Module Part 2. Oldest first — a true chronological history. Always starts with BatchCreated.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Paginated list of FgStockMovement, chronological
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FgStockMovement' }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
        '404': { description: Not found }

  /fg-batches/{fgBatchNo}/reserve:
    parameters:
      - name: fgBatchNo
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [FG Batches]
      summary: Reserve stock against a Sales Order
      description: >
        FG Module Part 3. Rejects (409) a Hold batch or qty > availableQty; 404 if salesOrderId
        doesn't exist. Creates the FgReservation, increments reservedQty, logs a Reserved movement,
        and recomputes both fgBatch.stockStatus and the parent SalesOrder.status (via
        recomputeSalesOrderStatus) in one transaction. A batch with availableQty still > 0 after
        this reservation stays Available — only availableQty reaching exactly 0 flips it to
        Reserved. See README "FG Module Part 3". Requires Admin/StoreManager.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [salesOrderId, qty]
              properties:
                salesOrderId: { type: integer }
                qty: { type: number, exclusiveMinimum: 0 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FgBatch' }
        '404': { description: Unknown fgBatchNo or salesOrderId }
        '409': { description: 'The batch is on Hold, or qty > availableQty' }

  /fg-reservations/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      tags: [FG Batches]
      summary: Release a reservation
      description: >
        FG Module Part 3. Only allowed while status = Active. Decrements fgBatch.reservedQty,
        logs an Unreserved movement, recomputes fgBatch.stockStatus (preserved as Hold, never
        silently cleared, if the batch is currently on Hold) and the parent SalesOrder.status.
        See README "FG Module Part 3". Requires Admin/StoreManager.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FgReservation' }
        '404': { description: Not found }
        '409': { description: Already Cancelled or Fulfilled }

  /sales-orders:
    get:
      tags: [Sales Orders]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: customer
          in: query
          schema: { type: string }
        - name: sku
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [Open, PartiallyReserved, FullyReserved, PartiallyDispatched, Dispatched, Closed] }
      responses:
        '200': { description: Paginated list of Sales Orders }
    post:
      tags: [Sales Orders]
      description: FG Module Part 3. Requires Admin/StoreManager. status is not accepted in the body — always starts Open.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesOrder' }
      responses:
        '201': { description: Created }
        '400': { description: Validation error }
        '409': { description: Duplicate salesOrderNo (generic P2002 mapping) }

  /sales-orders/{salesOrderNo}:
    parameters:
      - name: salesOrderNo
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Sales Orders]
      responses:
        '200':
          description: Sales Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesOrder' }
        '404': { description: Not found }
    patch:
      tags: [Sales Orders]
      description: FG Module Part 3. Requires Admin/StoreManager. status is not accepted here either.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalesOrder' }
      responses:
        '200': { description: Updated }
        '400': { description: No fields provided }
        '404': { description: Not found }
    delete:
      tags: [Sales Orders]
      description: >
        FG Module Part 3. Hard delete, requires Admin/StoreManager. Unlike warehouseId,
        FgReservation.salesOrderId IS a real DB-level FK with no cascade — fails with 400 while any
        reservation (even Cancelled) still references this Sales Order.
      responses:
        '200': { description: Deleted }
        '400': { description: A reservation (active or historical) still references this Sales Order }
        '404': { description: Not found }

  /sales-orders/{salesOrderNo}/reservations:
    parameters:
      - name: salesOrderNo
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Sales Orders]
      summary: The partial-fulfillment tracking view
      description: >
        FG Module Part 3. Every reservation (Active and historical) against this Sales Order,
        across whichever FG batches fulfilled it, oldest first. See README "FG Module Part 3".
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          description: Paginated list of FgReservation
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/FgReservation' }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
        '404': { description: Not found }

  /fg-dispatches:
    post:
      tags: [FG Dispatches]
      summary: Create a dispatch — the netting order is documented on the schema/README
      description: >
        FG Module Part 4. lineItems processed sequentially in ONE transaction — any line item's
        failure (unknown fgBatchId, Hold, non-Pass QC, over-quantity) rolls back the whole dispatch,
        including line items that were individually valid. Per line item: reservedQty (scoped to
        THIS dispatch's own salesOrderId only) is drawn down before availableQty; a reservation row
        fully consumed is marked Fulfilled. Recomputes fgBatch.dispatchStatus/stockStatus and, if
        salesOrderId was given, the parent SalesOrder.status. Requires Admin/StoreManager. See
        README "FG Module Part 4" for the full worked netting-order example.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lineItems]
              properties:
                salesOrderId: { type: integer, description: Optional — omit for general/unaffiliated stock movement. }
                lineItems:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [fgBatchId, quantity]
                    properties:
                      fgBatchId: { type: integer }
                      quantity: { type: number, exclusiveMinimum: 0 }
                notes: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FgDispatch' }
        '400': { description: Validation error, including an empty lineItems array }
        '404': { description: Unknown salesOrderId, or an unknown fgBatchId in a line item }
        '409': { description: 'A line item batch is on Hold, not QC-passed, or its quantity exceeds availableQty + reservedForThisSalesOrderQty' }
    get:
      tags: [FG Dispatches]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: salesOrderId
          in: query
          schema: { type: integer }
        - name: dateFrom
          in: query
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200': { description: Paginated list of FgDispatch, each with lineItems resolved to their batch's key info }

  /fg-dispatches/{dispatchNo}:
    parameters:
      - name: dispatchNo
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [FG Dispatches]
      responses:
        '200':
          description: FG dispatch detail, with lineItems resolved to their batch's key info
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FgDispatch' }
        '404': { description: Not found }
