    patch:
      tags: [HR Teams]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HrTeam' }
      responses:
        '200': { description: Updated }
        '400': { description: Unknown lineId }
        '404': { description: Not found }
    delete:
      tags: [HR Teams]
      responses:
        '200': { description: Deleted }
        '404': { description: Not found }

  /bom/model/{modelRef}:
    parameters:
      - name: modelRef
        in: path
