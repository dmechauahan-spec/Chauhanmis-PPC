        '200': { description: Exploded parts list for the SKU }
        '400': { description: Unknown modelRef }

  /bom:
    post:
      tags: [BOM]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BomComponent' }
      responses:
        '201': { description: Created }
        '400': { description: Unknown modelRef or partId }

  /bom/bulk:
    post:
      tags: [BOM]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                modelRef: { type: string }
                items:
                  type: array
                  items: { $ref: '#/components/schemas/BomComponent' }
      responses:
        '201': { description: All rows imported in one transaction }
        '400': { description: Unknown modelRef or partId(s) }

  /bom/{id}:
    parameters:
      - name: id
        in: path
        required: true
